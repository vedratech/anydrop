name: Bug report
description: Something does not work as described in the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. A small reproduction makes a fix much faster.
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - '@vedratech/anydrop-core'
        - '@vedratech/anydrop-ui'
        - '@vedratech/anydrop-react'
        - '@vedratech/anydrop-angular'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Options you pass, what you drop or pick (files or folders, sizes), and the steps. A StackBlitz or CodeSandbox link is ideal.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11, Safari on iPhone 15 (iOS 19)
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Backend
      description: Which server you upload to (Express, Laravel, FastAPI, Spring Boot, other) and any error response or console output.
