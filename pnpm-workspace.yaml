packages:
  - packages/*
  - demo
  - e2e
  - docs
  - examples/*

# pnpm 10+ blocks dependency install scripts unless approved. esbuild needs its postinstall.
# @parcel/watcher, lmdb and msgpackr-extract are optional native accelerators of the Angular
# toolchain (dev only in packages/angular and examples/angular); they are not needed.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  lmdb: false
  msgpackr-extract: false

# @angular/core/testing imports @angular/compiler without declaring it. Without this, pnpm hoists one
# arbitrary Angular version of it, and the Angular 22 example breaks the Angular 18 unit tests of
# packages/angular (two compilers fight over the JIT facade). Declared as an optional peer, each
# workspace project then gets its own compiler.
packageExtensions:
  '@angular/core':
    peerDependencies:
      '@angular/compiler': '*'
    peerDependenciesMeta:
      '@angular/compiler':
        optional: true
  # @angular/animations imports @angular/common without declaring it (same reason).
  '@angular/animations':
    peerDependencies:
      '@angular/common': '*'
    peerDependenciesMeta:
      '@angular/common':
        optional: true

# Security overrides for dev tooling only (nothing here reaches the published packages, which have no
# dependencies). Each line moves a transitive dependency to a patched release (Dependabot alerts).
overrides:
  # VitePress 1.6.4 (latest stable) pins vite 5; use a patched vite 6 for the docs site.
  'vitepress>vite': '^6.4.4'
  # eslint (root) and ng-packagr 18 (Angular devDeps, via glob 10) use old minimatch.
  'minimatch@>=7 <11.0.1': '^11.0.1'
  # typedoc 0.28.20 (latest) calls Minimatch#matchOne, which minimatch 11 removed: it keeps 10.2.6
  # (alert dismissed, docs generator only).
  'typedoc>minimatch': '10.2.6'
  # ng-packagr 18 > cacache 18 depends on glob 10 and tar 6.
  'glob@>=9 <=14.0.1': '^14.0.2'
  'tar@<7.5.21': '^7.5.21'
  # ng-packagr 18 bundles with esbuild 0.23.
  'esbuild@<0.25.0': '^0.25.0'
  # @angular/compiler-cli 18 > @babel/core 7.25.
  '@babel/core@<7.29.6': '^7.29.6'
