  <text x="104" y="544" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#e0f2fe">npm i @vedratech/anydrop-ui</text>
  <text x="1120" y="544" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#93c5fd">vedratech.github.io/anydrop</text>
